<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APOD Viewer</title>
    <!-- <script defer src="main.js"></script> -->
    <!-- Vanilla JavaScript -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
        <div>
            <form>
                <div class="field">
                    <label class="label">Date (YYYY-MM-DD)</label>
                    <div id="react-date-input"></div>
                </div>
                <div class="field">
                    <label class="label">Start Date (YYYY-MM-DD)</label>
                    <div class="control">
                    <input class="input" type="date" />
                    </div>
                </div>
                <div class="field">
                    <label class="label">End Date (YYYY-MM-DD)</label>
                    <div class="control">
                    <input class="input" type="date" />
                    </div>
                </div>
                <div class="field">
                    <label class="label">Count</label>
                    <div class="control">
                    <input class="input" type="number" id="count" placeholder="Count" />
                    </div>
                </div>
                <div class="field">
                    <label class="label">Include Video Thumbnails</label>
                    <div class="control">
                    <input class="checkbox" type="checkbox" />
                    </div>
                </div>
                <div class="field">
                    <div class="control">
                    <button class="button is-link" type="submit">Fetch APOD</button>
                    </div>
                </div>
            </form>
        </div>
    <div id="apod-content">
        <!-- APOD content will be displayed here -->
    </div>
        <script type="text/babel">
            const inputStyle = {
            margin: "5px",
            padding: "7px",
            border: "1px solid #ccc",
            borderRadius: "4px",
            };

            const handleChange = (event) => {
            const newDate = event.target.value;
            console.log("Selected date:", newDate);
            debugger;
            }

            function DateInputComponent() {
                const [date, setDate] = React.useState("");
                
                const handleDateChange = (event) => {
                    const newDate = event.target.value;
                    setDate(newDate);
                    console.log("Selected date:", newDate);
                };
                
                return (
                    <div className="control">
                        <input
                            className="input"
                            type="date"
                            style={inputStyle}
                            value={date}
                            onChange={handleDateChange}
                        />
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById("react-date-input"));
            root.render(<DateInputComponent />);

        </script>    
    </body>
</html>
